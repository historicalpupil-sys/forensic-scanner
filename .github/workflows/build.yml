          class _ForensicOverlayPainter extends CustomPainter {

            final bool isLocked;

            const _ForensicOverlayPainter({required this.isLocked});



            @override

            void paint(Canvas canvas, Size size) {

              final paint = Paint()

                ..color = isLocked ? Colors.greenAccent : Colors.amberAccent

                ..style = PaintingStyle.stroke

                ..strokeWidth = 2.0;



              final lScalePath = Path()

                ..moveTo(size.width * 0.12, size.height * 0.15)

                ..lineTo(size.width * 0.12, size.height * 0.82)

                ..lineTo(size.width * 0.85, size.height * 0.82);

              canvas.drawPath(lScalePath, paint);

            }



            @override

            bool shouldRepaint(covariant _ForensicOverlayPainter oldDelegate) =>

                oldDelegate.isLocked != isLocked;

          }

